# Fly.io config for the OCR backend.
# One app, two process groups sharing the same image:
#   - app    : the FastAPI HTTP API (auto-sleeps when idle to save money)
#   - worker : the always-on Celery worker (no HTTP, never auto-stops)
#
# Rename `app` below if the name is taken (must be globally unique on Fly).
app = "fin-uw-ocr-backend"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  # Celery broker/result backend point at Redis — set the real URL via `fly secrets set REDIS_URL=...`
  CELERY_WORKER_CONCURRENCY = "2"
  LOG_LEVEL = "INFO"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
  worker = "celery -A app.celery_app worker --loglevel=info -Q document_processing,chunk_processing,default --concurrency=2 --max-tasks-per-child=200 --time-limit=3600 --soft-time-limit=3300 -n worker@%h"

# HTTP service only applies to the `app` process. The worker has no inbound HTTP.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

# API machine — can sleep when idle.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

# Worker machine — stays running so queued OCR jobs always get picked up.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
